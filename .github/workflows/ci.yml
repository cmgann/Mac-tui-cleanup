name: macOS validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go mod download
      - run: make test vet release
      - uses: actions/upload-artifact@v4
        with:
          name: devclean-macos
          path: dist/devclean-darwin-*
